name: Canary (Ubuntu 26.04)

# Every workflow names its runner explicitly, so the "ubuntu-latest is migrating" notice never applies.
# The main CI stays on Ubuntu 24.04 so runs are reproducible. This weekly run builds and tests on Ubuntu 26.04,
# which GitHub is making the default, so any problem with the new image shows up here first without blocking pushes.
# When it has been green for a few weeks, change runs-on in ci.yml to ubuntu-26.04.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  canary:
    name: Lint, tests, build and browser tests on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: yarn test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: canary-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
